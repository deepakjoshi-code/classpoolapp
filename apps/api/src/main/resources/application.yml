spring:
  application:
    name: classpool-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/classpool}
    username: ${DB_USER:classpool}
    password: ${DB_PASSWORD:classpool_dev}

  jpa:
    hibernate:
      # `none`, not `validate`: schema is owned exclusively by Flyway (infra/db/migrations) per
      # ARCHITECTURE.md §1. `validate` was tried and rejected — Hibernate's schema validator has no
      # concept of Postgres extension column types (citext, text[]) and false-positives against
      # them even though both read/write correctly at runtime; Flyway is already the actual
      # correctness guarantee here, so asking Hibernate to *also* police the schema adds a
      # dialect-quirk-driven false alarm, not real safety.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    # Points at the single source of truth in infra/db/migrations rather than a copy under
    # src/main/resources. @project.basedir@ is filtered at build time (see pom.xml <resources>)
    # into an absolute path, so this works regardless of the process's working directory.
    locations: filesystem:@project.basedir@/../../infra/db/migrations
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

server:
  port: ${PORT:8080}

classpool:
  session:
    cookie-name: CLASSPOOL_SESSION
    ttl-days: 30
    cookie-secure: ${SESSION_COOKIE_SECURE:true}
    # "None" for a cross-origin deployment (frontend and API on different domains) — see
    # SessionCookieHelper's Javadoc. "None" requires cookie-secure=true (the default).
    cookie-same-site: ${SESSION_COOKIE_SAME_SITE:Lax}
  magic-link:
    ttl-minutes: 15
  app-base-url: ${APP_BASE_URL:http://localhost:8080}
  web-base-url: ${WEB_BASE_URL:http://localhost:3000}
  cors:
    # Comma-separated list of origins allowed to make credentialed cross-origin requests (needed
    # whenever apps/web runs on a different origin than this API — e.g. local dev, Next.js on :3000
    # against this on :8080 — see apps/web/src/lib/api/client.ts's `credentials: "include"`).
    # Defaults to just the configured web origin; override for additional origins (a deployed
    # frontend host, a preview environment, ...).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${classpool.web-base-url}}
  oauth2:
    google:
      # Unset in this sandbox (no live Google app) — the app must still start cleanly, so
      # OAuth2Config builds the ClientRegistration directly rather than via Spring Boot's
      # spring.security.oauth2.client.registration.* property binding, whose auto-configuration
      # hard-fails at startup on a blank client-id even when nothing ever calls /auth/google/callback.
      client-id: ${GOOGLE_CLIENT_ID:unconfigured-google-client-id}
      client-secret: ${GOOGLE_CLIENT_SECRET:unconfigured-google-client-secret}
  email:
    # "logging" (default) just logs the email — see LoggingEmailSender. Set to "resend" to send
    # real email via Resend's HTTP API for manual/staging testing — see ResendEmailSender.
    provider: ${EMAIL_PROVIDER:logging}
    from: ${EMAIL_FROM:onboarding@resend.dev}
    resend:
      api-key: ${RESEND_API_KEY:}

logging:
  level:
    app.classpool.api: INFO
