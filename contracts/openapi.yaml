openapi: 3.1.0
info:
  title: ClassPool API
  version: "0.1.0"
  description: >
    Phase 1 (PWA shell + auth), Phase 2 (schools/classes/memberships), and
    Phase 3 (manual requirements — no AI yet) of the V1 build order — see
    ARCHITECTURE.md §4 and docs/PRD.md §17.3. Source of truth for both
    apps/api (implements this) and apps/web (generates its TS client from
    this via openapi-typescript).
servers:
  - url: /api/v1

security:
  - sessionCookie: []

paths:
  /auth/magic-link/request:
    post:
      operationId: requestMagicLink
      security: []
      summary: Email a single-use sign-in link. Always 204, whether or not the email exists (no account enumeration).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "204": { description: Link sent if the address is valid; same response either way }

  /auth/magic-link/verify:
    get:
      operationId: verifyMagicLink
      security: []
      summary: Exchange a magic-link token for a session. Token is single-use, 15-minute expiry.
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Session established
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { description: Token invalid, expired, or already used }

  /auth/google/callback:
    get:
      operationId: googleOAuthCallback
      security: []
      summary: OAuth2 redirect target (Spring Security OAuth2 Client), exchanges Google's code for a session.
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Session established
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }

  /auth/logout:
    post:
      operationId: logout
      responses:
        "204": { description: Session cleared }

  /me:
    get:
      operationId: getCurrentUser
      summary: Current user plus a summary of their household's classroom memberships (PRD §12 multi-class HOME update).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401": { description: Not authenticated }

  /schools/search:
    get:
      operationId: searchSchools
      summary: Fuzzy match against existing schools, for the dedup-check-before-create flow (PRD §2.3 update).
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/School" }

  /schools:
    post:
      operationId: createSchool
      summary: Create a new school record. Client is expected to have called /schools/search first and confirmed no match.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/School" }

  /classrooms:
    post:
      operationId: createClassroom
      summary: >
        Create a class and become its organizer (Membership.role = ORGANIZER,
        PRD §2.1). Also runs the classroom-level dedup fuzzy-match — see
        `dedupWarning` on the response.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateClassroomRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassroomCreated" }

  /classrooms/{classroomId}:
    get:
      operationId: getClassroom
      summary: >
        Fetch a classroom. Returns 403 unless the caller has a Membership on
        this exact classroom — this endpoint is the primary target of PRD
        §14's tenant-isolation authorization test.
      parameters:
        - $ref: "#/components/parameters/ClassroomId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Classroom" }
        "403": { description: Caller has no Membership on this classroom }
        "404": { description: Not found }

  /classrooms/{classroomId}/invites:
    post:
      operationId: createInvite
      summary: Generate a join link + QR payload for this classroom. Organizer/co-organizer only.
      parameters:
        - $ref: "#/components/parameters/ClassroomId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                channel: { type: string, enum: [EMAIL, SMS, LINK, QR] }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invite" }
        "403": { description: Caller is not an organizer on this classroom }

  /invites/{token}:
    get:
      operationId: previewInvite
      security: []
      summary: Public preview shown before auth — school/class context + participation progress (PRD §2.2).
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitePreview" }
        "404": { description: Invite not found or expired }

  /invites/{token}/join:
    post:
      operationId: joinViaInvite
      summary: >
        Authenticated parent joins the classroom for one student. Creates a
        Household on first join if the user has none, creates the Student,
        creates a PARENT Membership, marks the Invite converted. If the
        classroom's pool has already left OPEN_FOR_CONTRIBUTIONS, the
        resulting Membership is flagged `lateJoin: true` (PRD §13.3 update).
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentFirstName]
              properties:
                studentFirstName: { type: string, minLength: 1 }
      responses:
        "201":
          description: Joined
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "401": { description: Not authenticated }
        "404": { description: Invite not found or expired }

  /classrooms/{classroomId}/pools:
    post:
      operationId: createPool
      summary: >
        Start a new pool on a classroom (PRD §2.3 — "a class can run multiple
        pools per year"). Organizer/co-organizer only. Starts in DRAFT
        (PRD §13.3).
      parameters:
        - $ref: "#/components/parameters/ClassroomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: "Fall Supplies" }
                poolType: { type: string, default: SUPPLIES }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pool" }
        "403": { description: Caller is not an organizer on this classroom }
    get:
      operationId: listPoolsForClassroom
      summary: All pools for a classroom, most recent first. Any member may view.
      parameters:
        - $ref: "#/components/parameters/ClassroomId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Pool" }
        "403": { description: Caller has no Membership on this classroom }

  /pools/{poolId}:
    get:
      operationId: getPool
      summary: >
        Fetch a pool and its requirements. Returns 403 unless the caller has
        a Membership on the pool's classroom (same tenant-isolation bar as
        GET /classrooms/{classroomId} — PRD §14).
      parameters:
        - $ref: "#/components/parameters/PoolId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PoolDetail" }
        "403": { description: Caller has no Membership on this pool's classroom }
        "404": { description: Not found }

  /pools/{poolId}/requirements:
    post:
      operationId: addRequirement
      summary: >
        Manually add a requirement to the pool (PRD §3 Phase 3 — "complete a
        supply list without AI"). Organizer/co-organizer only. Starts in
        EXTRACTED state with no confidence score (manual entries are never
        scored — PRD §3.2 update: manual entry is a permanent parallel path,
        not just a pre-AI placeholder).
      parameters:
        - $ref: "#/components/parameters/PoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRequirementRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Requirement" }
        "403": { description: Caller is not an organizer on this pool's classroom }
        "409": { description: "Pool is no longer in DRAFT — requirements are locked once confirmed" }

  /pools/{poolId}/requirements/{requirementId}:
    patch:
      operationId: updateRequirement
      summary: >
        Edit a requirement (the "Correct" action — PRD §3.3). Organizer/
        co-organizer only, and only while the pool is still DRAFT.
      parameters:
        - $ref: "#/components/parameters/PoolId"
        - $ref: "#/components/parameters/RequirementId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRequirementRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Requirement" }
        "403": { description: Caller is not an organizer on this pool's classroom }
        "409": { description: Pool is no longer in DRAFT }
    delete:
      operationId: removeRequirement
      summary: Remove a requirement (the "Remove" action — PRD §3.3). Same authorization/state rules as edit.
      parameters:
        - $ref: "#/components/parameters/PoolId"
        - $ref: "#/components/parameters/RequirementId"
      responses:
        "204": { description: Removed }
        "403": { description: Caller is not an organizer on this pool's classroom }
        "409": { description: Pool is no longer in DRAFT }

  /pools/{poolId}/confirm:
    post:
      operationId: confirmPool
      summary: >
        Organizer confirms the requirement list is ready (PRD §3.3 —
        "nothing is financially actionable until a human organizer
        verifies"). Requires at least one requirement. Moves every
        requirement EXTRACTED/NEEDS_REVIEW → CONFIRMED, then the pool
        DRAFT → OPEN_FOR_INVENTORY (PRD §13.2/§13.3's stated mapping: a pool
        can't leave DRAFT until every requirement in it is at least
        CONFIRMED). `confirmedStudentCount` is the number of distinct
        students already joined to the classroom at confirm time — PRD §3.4's
        "confirmed number of participating students" — used to compute each
        requirement's aggregate class demand, returned per-requirement here.
      parameters:
        - $ref: "#/components/parameters/PoolId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PoolDetail" }
        "403": { description: Caller is not an organizer on this pool's classroom }
        "409": { description: "Pool already confirmed, or has zero requirements" }

  /pools/{poolId}/inventory:
    get:
      operationId: getMyInventory
      summary: >
        "Shop Your Home First" (PRD §4) — the caller's own household
        inventory status for every requirement in this pool, one line per
        (requirement, student they have in this classroom). Only meaningful
        once the pool has left DRAFT (requirements are CONFIRMED with a
        known quantityPerStudent); returns an empty array for a still-DRAFT
        pool rather than an error. Any member may call this for their own
        household — there is nothing to view for anyone else's.
      parameters:
        - $ref: "#/components/parameters/PoolId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InventoryLine" }
        "403": { description: Caller has no Membership on this pool's classroom }

  /pools/{poolId}/requirements/{requirementId}/inventory:
    put:
      operationId: setInventory
      summary: >
        Record how many of this requirement the caller's student already
        owns (PRD §4's quick +/- stepper) — upsert, one row per
        (requirement, student). `ownedQuantity` is clamped to
        `[0, quantityPerStudent]` server-side (owning more than required
        doesn't reduce anyone else's demand — surplus offering is a
        separate, later action per PRD §5, not implied by a high inventory
        number here). Caller must have a Membership on this pool's
        classroom for the given `studentId` — never lets one household
        record inventory for another's child.
      parameters:
        - $ref: "#/components/parameters/PoolId"
        - $ref: "#/components/parameters/RequirementId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentId, ownedQuantity]
              properties:
                studentId: { type: string, format: uuid }
                ownedQuantity: { type: integer, minimum: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryLine" }
        "403": { description: "Caller has no Membership on this classroom for that student" }
        "409": { description: "Pool is still DRAFT — nothing to record inventory against yet" }

  /pools/{poolId}/inventory/summary:
    get:
      operationId: getInventorySummary
      summary: >
        Organizer dashboard aggregate (PRD §12.3 — "Inventory completed
        19/25"): how many of the classroom's students have at least one
        inventory line recorded, out of the total joined, plus per-requirement
        totals already owned across every household. Organizer/co-organizer
        only.
      parameters:
        - $ref: "#/components/parameters/PoolId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventorySummary" }
        "403": { description: Caller is not an organizer on this pool's classroom }

  /household/dashboard:
    get:
      operationId: getHouseholdDashboard
      summary: >
        Multi-class household view (PRD §12 update) — every classroom the
        household's students belong to. Phase 1-2 scope: membership +
        classroom context only, no pool financials yet (those land with
        later phases).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HouseholdDashboard" }
        "401": { description: Not authenticated }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: CLASSPOOL_SESSION

  parameters:
    ClassroomId:
      name: classroomId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PoolId:
      name: poolId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RequirementId:
      name: requirementId
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    Session:
      type: object
      properties:
        userId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }

    CurrentUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        householdId: { type: string, format: uuid, nullable: true }
        memberships:
          type: array
          items: { $ref: "#/components/schemas/Membership" }

    School:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    CreateClassroomRequest:
      type: object
      required: [schoolYearLabel, grade, teacherLabel]
      properties:
        schoolId: { type: string, format: uuid, nullable: true, description: "Omit to create a new school from schoolName" }
        schoolName: { type: string, nullable: true }
        schoolYearLabel: { type: string, example: "2026-2027" }
        grade: { type: string, example: "Grade 1" }
        teacherLabel: { type: string, example: "Ms. Smith" }
        teacherEmail: { type: string, format: email, nullable: true }
        studentCountEstimate: { type: integer, nullable: true }

    ClassroomCreated:
      type: object
      properties:
        classroom: { $ref: "#/components/schemas/Classroom" }
        dedupWarning:
          type: array
          nullable: true
          description: Similar existing classrooms found — PRD §2.3 "Is this your class?" prompt. Null/empty if none found.
          items: { $ref: "#/components/schemas/Classroom" }

    Classroom:
      type: object
      properties:
        id: { type: string, format: uuid }
        schoolId: { type: string, format: uuid }
        schoolName: { type: string }
        schoolYearLabel: { type: string }
        grade: { type: string }
        teacherLabel: { type: string }
        studentCountEstimate: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
        pools:
          type: array
          description: Summary of this classroom's pools, most recent first — lets the household dashboard show pool state without a second call per classroom.
          items: { $ref: "#/components/schemas/Pool" }

    Invite:
      type: object
      properties:
        token: { type: string }
        joinUrl: { type: string, format: uri }
        qrPayload: { type: string, description: "Data to render as a QR code, equal to joinUrl" }
        channel: { type: string, enum: [EMAIL, SMS, LINK, QR] }

    InvitePreview:
      type: object
      properties:
        classroom: { $ref: "#/components/schemas/Classroom" }
        membersJoinedCount: { type: integer }
        studentCountEstimate: { type: integer, nullable: true }

    Membership:
      type: object
      properties:
        id: { type: string, format: uuid }
        classroomId: { type: string, format: uuid }
        role: { type: string, enum: [PARENT, ORGANIZER, CO_ORGANIZER] }
        studentId: { type: string, format: uuid, nullable: true }
        studentFirstName: { type: string, nullable: true }
        lateJoin: { type: boolean }
        classroom: { $ref: "#/components/schemas/Classroom" }

    HouseholdDashboard:
      type: object
      properties:
        householdId: { type: string, format: uuid }
        memberships:
          type: array
          items: { $ref: "#/components/schemas/Membership" }

    Pool:
      type: object
      properties:
        id: { type: string, format: uuid }
        classroomId: { type: string, format: uuid }
        name: { type: string }
        poolType: { type: string }
        state:
          type: string
          enum: [DRAFT, OPEN_FOR_INVENTORY, OPEN_FOR_CONTRIBUTIONS, RECONCILING, PURCHASE_PROPOSED, PAYMENT_OPEN, ORDERED, DISTRIBUTING, COMPLETED]
        requirementCount: { type: integer }
        createdAt: { type: string, format: date-time }

    PoolDetail:
      allOf:
        - $ref: "#/components/schemas/Pool"
        - type: object
          properties:
            requirements:
              type: array
              items: { $ref: "#/components/schemas/Requirement" }

    Requirement:
      type: object
      properties:
        id: { type: string, format: uuid }
        poolId: { type: string, format: uuid }
        name: { type: string }
        quantityPerStudent: { type: integer }
        brand: { type: string, nullable: true }
        strictness: { type: string, enum: [EXACT, EQUIVALENT_ALLOWED, GENERIC] }
        state:
          type: string
          enum: [EXTRACTED, NEEDS_REVIEW, CONFIRMED, POOLING, LOCKED, PURCHASING, FULFILLED, CLOSED]
        sourceEvidence: { type: string, nullable: true, description: "Null for manual entries — only AI extraction (Phase 11) populates this." }
        confidence: { type: number, nullable: true, description: "Null for manual entries — PRD §3.2 update." }
        totalDemand:
          type: integer
          nullable: true
          description: "quantityPerStudent × confirmedStudentCount, set once the pool is confirmed (PRD §3.4). Null before confirmation."
        createdAt: { type: string, format: date-time }

    CreateRequirementRequest:
      type: object
      required: [name, quantityPerStudent]
      properties:
        name: { type: string, example: "Glue Stick" }
        quantityPerStudent: { type: integer, minimum: 1, example: 4 }
        brand: { type: string, nullable: true, example: "Elmer's" }
        strictness: { type: string, enum: [EXACT, EQUIVALENT_ALLOWED, GENERIC], default: EQUIVALENT_ALLOWED }

    InventoryLine:
      type: object
      properties:
        requirementId: { type: string, format: uuid }
        requirementName: { type: string }
        quantityPerStudent: { type: integer }
        studentId: { type: string, format: uuid }
        studentFirstName: { type: string }
        ownedQuantity: { type: integer }
        stillNeeded:
          type: integer
          description: "max(0, quantityPerStudent - ownedQuantity) — PRD §4's 'Still needed'."

    InventorySummary:
      type: object
      properties:
        studentsWithInventorySubmitted: { type: integer }
        totalJoinedStudents: { type: integer }
        perRequirement:
          type: array
          items:
            type: object
            properties:
              requirementId: { type: string, format: uuid }
              requirementName: { type: string }
              totalOwned: { type: integer }
              totalRequired:
                type: integer
                nullable: true
                description: Same as Requirement.totalDemand — null if the pool isn't confirmed yet.
