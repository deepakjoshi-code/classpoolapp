services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: classpool
      POSTGRES_USER: classpool
      POSTGRES_PASSWORD: classpool_dev
    ports:
      - "5432:5432"
    volumes:
      - classpool_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classpool"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  classpool_pg_data:
